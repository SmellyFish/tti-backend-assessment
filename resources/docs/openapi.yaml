openapi: 3.1.0
info:
  title: PRO API
  version: 1.0.0
  description: >
    Patient Reported Outcomes API built with Laravel.
    This specification documents all currently implemented endpoints.
  license:
    name: MIT
    identifier: MIT
servers:
  - url: http://localhost:8000
    description: Local development
tags:
  - name: auth
    description: Token issuance operations
  - name: easter-egg
    description: Optional playful endpoint
  - name: patients
    description: Patient creation operations
  - name: instruments
    description: Instrument creation operations
  - name: submissions
    description: Submission create/list/show operations
  - name: summary
    description: Aggregated patient summary operations
security: []
paths:
  /api/try-me:
    get:
      tags: [easter-egg]
      summary: Only for the curious of mind
      operationId: tryMe
      responses:
        '200':
          description: Curiosity rewarded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TryMeResponse'
        '429':
          description: Too many requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TooManyRequestsError'
  /api/auth/token:
    post:
      tags: [auth]
      summary: Issue API token
      operationId: issueAuthToken
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StoreAuthTokenRequest'
            example:
              email: auth@example.com
              password: password
              device_name: postman
      responses:
        '200':
          description: Token issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokenResponse'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedError'
        '422':
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        '429':
          description: Too many requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TooManyRequestsError'
  /api/patients:
    post:
      tags: [patients]
      summary: Create patient
      operationId: createPatient
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StorePatientRequest'
            example:
              name: Alex Chen
              date_of_birth: '1990-05-20'
              mrn: MRN-10001
      responses:
        '201':
          description: Patient created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Patient'
        '422':
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        '429':
          description: Too many requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TooManyRequestsError'
  /api/instruments:
    post:
      tags: [instruments]
      summary: Create instrument with questions
      operationId: createInstrument
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StoreInstrumentRequest'
      responses:
        '201':
          description: Instrument created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Instrument'
        '422':
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        '429':
          description: Too many requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TooManyRequestsError'
  /api/patients/{patient}/submissions:
    post:
      tags: [submissions]
      summary: Create submission for patient
      operationId: createSubmission
      parameters:
        - $ref: '#/components/parameters/PatientId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StoreSubmissionRequest'
      responses:
        '201':
          description: Submission created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Submission'
        '404':
          description: Patient not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundError'
        '422':
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        '429':
          description: Too many requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TooManyRequestsError'
    get:
      tags: [submissions]
      summary: List submissions for patient
      operationId: listSubmissions
      parameters:
        - $ref: '#/components/parameters/PatientId'
      responses:
        '200':
          description: Paginated submissions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedSubmissions'
        '404':
          description: Patient not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundError'
        '429':
          description: Too many requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TooManyRequestsError'
  /api/patients/{patient}/submissions/{submission}:
    get:
      tags: [submissions]
      summary: Get one submission scoped to patient
      operationId: getSubmission
      parameters:
        - $ref: '#/components/parameters/PatientId'
        - $ref: '#/components/parameters/SubmissionId'
      responses:
        '200':
          description: Submission details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Submission'
        '404':
          description: Patient or submission not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundError'
        '429':
          description: Too many requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TooManyRequestsError'
  /api/patients/{patient}/summary:
    get:
      tags: [summary]
      summary: Get aggregated summary for patient and instrument
      operationId: getPatientSummary
      parameters:
        - $ref: '#/components/parameters/PatientId'
        - $ref: '#/components/parameters/InstrumentIdQuery'
      responses:
        '200':
          description: Summary response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PatientSummary'
              examples:
                with_submissions:
                  summary: With submissions
                  value:
                    patient_id: 1
                    instrument_id: 1
                    total_submissions: 2
                    earliest_submission: '2026-04-20T10:00:00+00:00'
                    latest_submission: '2026-04-21T10:00:00+00:00'
                    questions:
                      - question_id: 1
                        prompt: Overall, how would you rate your pain this week?
                        response_type: scale_1_5
                        average_score: 3
                      - question_id: 2
                        prompt: Did you take your medications as directed?
                        response_type: yes_no
                        yes_percentage: 50
                      - question_id: 3
                        prompt: Anything else for your care team?
                        response_type: free_text
                        non_empty_count: 1
                no_submissions:
                  summary: No submissions yet
                  value:
                    patient_id: 1
                    instrument_id: 1
                    total_submissions: 0
                    earliest_submission: null
                    latest_submission: null
                    questions:
                      - question_id: 1
                        prompt: Overall, how would you rate your pain this week?
                        response_type: scale_1_5
                        average_score: null
                      - question_id: 2
                        prompt: Did you take your medications as directed?
                        response_type: yes_no
                        yes_percentage: null
                      - question_id: 3
                        prompt: Anything else for your care team?
                        response_type: free_text
                        non_empty_count: 0
        '404':
          description: Patient not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundError'
        '422':
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        '429':
          description: Too many requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TooManyRequestsError'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: API Token
  parameters:
    PatientId:
      name: patient
      in: path
      required: true
      schema:
        type: integer
    SubmissionId:
      name: submission
      in: path
      required: true
      schema:
        type: integer
    InstrumentIdQuery:
      name: instrument_id
      in: query
      required: true
      schema:
        type: integer
  schemas:
    TryMeResponse:
      type: object
      required: [message, chorus]
      properties:
        message:
          type: string
        chorus:
          type: array
          items:
            type: string
    StoreAuthTokenRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
        device_name:
          type: [string, 'null']
          maxLength: 255
    AuthTokenUser:
      type: object
      required: [id, name, email]
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
          format: email
    AuthTokenResponse:
      type: object
      required: [token, token_type, user]
      properties:
        token:
          type: string
        token_type:
          type: string
          example: Bearer
        user:
          $ref: '#/components/schemas/AuthTokenUser'
    ResponseType:
      type: string
      enum: [scale_1_5, yes_no, free_text]
    StorePatientRequest:
      type: object
      required: [name, date_of_birth, mrn]
      properties:
        name:
          type: string
          maxLength: 255
        date_of_birth:
          type: string
          format: date
        mrn:
          type: string
          maxLength: 255
    StoreInstrumentRequest:
      type: object
      required: [title, questions]
      properties:
        title:
          type: string
          maxLength: 255
        description:
          type: [string, 'null']
        questions:
          type: array
          minItems: 1
          items:
            type: object
            required: [prompt, response_type, sort_order]
            properties:
              prompt:
                type: string
              response_type:
                $ref: '#/components/schemas/ResponseType'
              sort_order:
                type: integer
                minimum: 0
    StoreSubmissionRequest:
      type: object
      required: [instrument_id, answers]
      properties:
        instrument_id:
          type: integer
        answers:
          type: array
          minItems: 1
          items:
            type: object
            required: [question_id, value]
            properties:
              question_id:
                type: integer
              value:
                oneOf:
                  - type: integer
                  - type: boolean
                  - type: string
    Patient:
      type: object
      required: [id, name, date_of_birth, mrn, created_at, updated_at]
      properties:
        id:
          type: integer
        name:
          type: string
        date_of_birth:
          type: string
          format: date
        mrn:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    Question:
      type: object
      required: [id, instrument_id, prompt, response_type, sort_order, created_at, updated_at]
      properties:
        id:
          type: integer
        instrument_id:
          type: integer
        prompt:
          type: string
        response_type:
          $ref: '#/components/schemas/ResponseType'
        sort_order:
          type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    Instrument:
      type: object
      required: [id, title, description, questions, created_at, updated_at]
      properties:
        id:
          type: integer
        title:
          type: string
        description:
          type: [string, 'null']
        questions:
          type: array
          items:
            $ref: '#/components/schemas/Question'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    Answer:
      type: object
      required: [id, question_id, value, created_at, updated_at]
      properties:
        id:
          type: integer
        question_id:
          type: integer
        value:
          oneOf:
            - type: integer
            - type: boolean
            - type: string
        question:
          $ref: '#/components/schemas/Question'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    Submission:
      type: object
      required: [id, patient_id, instrument_id, submitted_at, answers, created_at, updated_at]
      properties:
        id:
          type: integer
        patient_id:
          type: integer
        instrument_id:
          type: integer
        submitted_at:
          type: string
          format: date-time
        instrument:
          $ref: '#/components/schemas/Instrument'
        answers:
          type: array
          items:
            $ref: '#/components/schemas/Answer'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    PaginationLinks:
      type: object
      properties:
        first:
          type: [string, 'null']
        last:
          type: [string, 'null']
        prev:
          type: [string, 'null']
        next:
          type: [string, 'null']
    PaginationMeta:
      type: object
      properties:
        current_page:
          type: integer
        from:
          type: [integer, 'null']
        last_page:
          type: integer
        path:
          type: string
        per_page:
          type: integer
        to:
          type: [integer, 'null']
        total:
          type: integer
    PaginatedSubmissions:
      type: object
      required: [data, links, meta]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Submission'
        links:
          $ref: '#/components/schemas/PaginationLinks'
        meta:
          $ref: '#/components/schemas/PaginationMeta'
    PatientSummaryQuestion:
      type: object
      required: [question_id, prompt, response_type]
      properties:
        question_id:
          type: integer
        prompt:
          type: string
        response_type:
          $ref: '#/components/schemas/ResponseType'
        average_score:
          type: [number, 'null']
        yes_percentage:
          type: [number, 'null']
        non_empty_count:
          type: integer
    PatientSummary:
      type: object
      required: [patient_id, instrument_id, total_submissions, earliest_submission, latest_submission, questions]
      properties:
        patient_id:
          type: integer
        instrument_id:
          type: integer
        total_submissions:
          type: integer
        earliest_submission:
          type: [string, 'null']
          format: date-time
        latest_submission:
          type: [string, 'null']
          format: date-time
        questions:
          type: array
          items:
            $ref: '#/components/schemas/PatientSummaryQuestion'
    ValidationError:
      type: object
      required: [message, errors]
      properties:
        message:
          type: string
          example: Validation failed
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
    NotFoundError:
      type: object
      required: [message]
      properties:
        message:
          type: string
          example: Not found
    UnauthorizedError:
      type: object
      required: [message]
      properties:
        message:
          type: string
          example: Invalid credentials.
    TooManyRequestsError:
      type: object
      required: [message]
      properties:
        message:
          type: string
          example: Too Many Attempts.
